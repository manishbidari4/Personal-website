<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon</title>
<meta name="description" content="We're building something new. Leave your email and we'll let you know when it's ready." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1b1a;
    --paper: #f2ede4;
    --mustard: #d8a72e;
    --line: rgba(242, 237, 228, 0.16);
    --muted: rgba(242, 237, 228, 0.62);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 6vw 7vw 4vw;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--line);
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: 0.01em;
  }

  .mark span { color: var(--mustard); }

  header time {
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 4vw 0;
  }

  .content {
    max-width: 720px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    line-height: 1.02;
    margin: 0 0 1.6rem;
    letter-spacing: -0.01em;
  }

  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--mustard);
  }

  .lede {
    font-size: clamp(1rem, 1.6vw, 1.2rem);
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 0 2.8rem;
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 1.2rem;
    max-width: 460px;
    border-bottom: 1px solid var(--paper);
    padding-bottom: 0.75rem;
  }

  form label {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  input[type="email"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 0.4rem 0;
  }

  input[type="email"]::placeholder {
    color: var(--muted);
  }

  button {
    background: none;
    border: none;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    padding: 0.4rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: color 0.2s ease;
  }

  button:hover { color: var(--mustard); }

  button svg {
    width: 16px;
    height: 16px;
    transition: transform 0.2s ease;
  }

  button:hover svg { transform: translateX(3px); }

  .note {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  .note.success { color: var(--mustard); }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 2.5rem;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
  }

  footer nav {
    display: flex;
    gap: 1.6rem;
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  footer a:hover {
    color: var(--paper);
    border-color: var(--paper);
  }

  @media (max-width: 640px) {
    body { padding: 8vw 6vw; }
    header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    footer { flex-direction: column; align-items: flex-start; gap: 1rem; }
    form { flex-direction: column; align-items: stretch; gap: 0.8rem; }
    button { align-self: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="mark">Studio<span>.</span></div>
  <time id="today"></time>
</header>

<main>
  <div class="content">
    <h1>We're building<br><em>something new.</em></h1>
    <p class="lede">
      The site isn't ready yet, but the work already is. Leave your email and
      we'll send one message the day it opens &mdash; nothing before that.
    </p>

    <form id="notify-form">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
      <button type="submit">
        Notify me
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 8h11M9 4l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
    <p class="note" id="form-note"></p>
  </div>
</main>

<footer>
  <span>&copy; <span id="year"></span> Studio. All rights reserved.</span>
  <nav>
    <a href="mailto:hello@example.com">hello@example.com</a>
    <a href="#" aria-disabled="true">Twitter</a>
    <a href="#" aria-disabled="true">Instagram</a>
  </nav>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  // Dummy submit handler — no backend wired up yet.
  // Replace this with a real request to your email/waitlist provider.
  const form = document.getElementById('notify-form');
  const note = document.getElementById('form-note');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    note.textContent = 'Thanks — we\'ll be in touch when it\'s live.';
    note.classList.add('success');
    form.reset();
  });
</script>

</body>
</html>
